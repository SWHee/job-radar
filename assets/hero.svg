<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">Your next role. Within reach.</title>
  <desc id="desc">Job Radar collects company job postings, filters them with Claude, and organizes matching roles in Notion. Concept illustration, not a product screenshot.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#183e35" stroke-opacity=".05"/></pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9cbf75" stop-opacity=".4"/><stop offset="1" stop-color="#9cbf75" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="600" rx="24" fill="#f4f1e7"/>
  <rect width="1280" height="600" rx="24" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="56" width="130" height="30" rx="15" fill="#183e35"/>
    <text x="129" y="76" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#f4f1e7">JOB RADAR</text>
    <text x="64" y="187" font-size="68" font-weight="700" letter-spacing="-3" fill="#1c2924">Your next role.</text>
    <text x="64" y="263" font-size="68" font-weight="700" letter-spacing="-3" fill="#49634c">Within reach.</text>
    <text x="67" y="315" font-size="20" fill="#5e6960">Less tab-hopping. A clearer job search.</text>
    <path d="M66 365h420" stroke="#183e35" stroke-opacity=".18"/>
    <text x="67" y="410" font-size="16" font-weight="700" fill="#183e35">01</text>
    <text x="104" y="410" font-size="19" fill="#1c2924">Collect from company career pages.</text>
    <text x="67" y="450" font-size="16" font-weight="700" fill="#183e35">02</text>
    <text x="104" y="450" font-size="19" fill="#1c2924">Filter by role and experience.</text>
    <text x="67" y="490" font-size="16" font-weight="700" fill="#183e35">03</text>
    <text x="104" y="490" font-size="19" fill="#1c2924">Keep matching roles in Notion.</text>
    <g transform="translate(936 273)">
      <circle r="182" fill="#e9edde" stroke="#183e35" stroke-opacity=".14"/>
      <g fill="none" stroke="#183e35" stroke-opacity=".17"><circle r="134"/><circle r="86"/><circle r="38"/><path d="M-182 0h364M0-182v364M-129-129l258 258M-129 129l258-258"/></g>
      <path d="M0 0V-182a182 182 0 0 1 158 91Z" fill="url(#sweep)"/>
      <path d="m0 0 158-91" stroke="#49634c" stroke-width="2"/>
      <circle r="6" fill="#183e35"/>
      <circle cx="91" cy="-53" r="14" fill="#183e35" fill-opacity=".1"/>
      <circle cx="91" cy="-53" r="6" fill="#183e35"/>
      <circle cx="-91" cy="-96" r="5" fill="#7e9d65"/>
      <circle cx="-68" cy="94" r="5" fill="#7e9d65"/>
      <circle cx="94" cy="87" r="4" fill="#7e9d65"/>
    </g>
    <rect x="722" y="438" width="420" height="90" rx="16" fill="#183e35"/>
    <rect x="744" y="459" width="48" height="48" rx="12" fill="#c2e5a4"/>
    <path d="m758 483 7 7 14-17" fill="none" stroke="#183e35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="810" y="475" font-size="16" font-weight="700" fill="#f4f1e7">From career pages to your shortlist.</text>
    <text x="810" y="499" font-size="14" fill="#b7cabb">Claude Code + MCP + Notion</text>
    <text x="64" y="558" font-size="11" letter-spacing="1.5" fill="#7d867b">A PERSONAL JOB-SEARCH WORKFLOW</text>
